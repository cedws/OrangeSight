name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    name: Archive OrangeSight
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build unsigned iOS release archive
        run: >
          xcodebuild -quiet
          -project OrangeSight.xcodeproj
          -scheme OrangeSight
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/OrangeSight.xcarchive"
          CODE_SIGNING_ALLOWED=NO archive

      - name: Package archive
        run: >
          tar -czf "$RUNNER_TEMP/OrangeSight.xcarchive.tar.gz"
          -C "$RUNNER_TEMP" OrangeSight.xcarchive

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: OrangeSight-unsigned
          path: ${{ runner.temp }}/OrangeSight.xcarchive.tar.gz
          if-no-files-found: error
          compression-level: 0
